      </rect>
      <rect y="30" width="18" height="6" rx="3" fill="#F0C55A" opacity=".26"/>
      <rect x="24" y="25" width="18" height="11" rx="3" fill="#F0C55A" opacity=".42"/>
      <rect x="48" y="18" width="18" height="18" rx="3" fill="#F0C55A" opacity=".56"/>
    </g>
  </g>

