        <animate attributeName="y" values="66;50;60;44;66" dur="5.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="48" y="48" width="28" height="60" rx="8" fill="url(#gold)">
        <animate attributeName="height" values="60;42;72;54;60" dur="6.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="48;66;36;54;48" dur="6.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="96" y="34" width="28" height="74" rx="8" fill="url(#gold)">
        <animate attributeName="height" values="74;88;62;80;74" dur="5.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="34;20;46;28;34" dur="5.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="144" y="54" width="28" height="54" rx="8" fill="url(#gold)">
        <animate attributeName="height" values="54;68;46;72;54" dur="6.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="54;40;62;36;54" dur="6.4s" repeatCount="indefinite"/>
