        <animate attributeName="y" values="24;36;12;30;24" dur="6s" repeatCount="indefinite"/>
      </rect>
      <rect x="240" y="18" width="28" height="90" rx="8" fill="url(#gold)">
        <animate attributeName="height" values="90;104;78;96;90" dur="5.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="18;4;30;12;18" dur="5.4s" repeatCount="indefinite"/>
      </rect>
      <path d="M8 86 C58 72 96 82 136 62 C178 40 216 46 260 28 C308 10 344 20 382 14" fill="none" stroke="#E7D39A" stroke-width="2" stroke-linecap="round" opacity=".36">
        <animate attributeName="d" values="M8 86 C58 72 96 82 136 62 C178 40 216 46 260 28 C308 10 344 20 382 14;M8 84 C58 76 98 76 136 64 C180 46 218 42 260 31 C308 16 346 22 382 16;M8 86 C58 72 96 82 136 62 C178 40 216 46 260 28 C308 10 344 20 382 14" dur="7s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <g transform="translate(474 232)">
    <rect width="212" height="168" rx="24" fill="rgba(255,255,255,.044)" stroke="rgba(255,255,255,.09)"/>
    <text x="18" y="31" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="900" fill="#8F9AAF" letter-spacing="1.4">WEEKLY REVIEW</text>
    <text x="18" y="60" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900" fill="#F7E7B2">Stable execution</text>
    <text x="18" y="82" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#8F9AAF">Risk controlled</text>
    <g transform="translate(18 104)">
      <rect width="22" height="22" rx="7" fill="#F0C55A" opacity=".72"/>
      <rect x="30" width="22" height="22" rx="7" fill="#23D18B" opacity=".42"/>
      <rect x="60" width="22" height="22" rx="7" fill="#FFFFFF" opacity=".10"/>
      <rect x="90" width="22" height="22" rx="7" fill="#F0C55A" opacity=".34"/>
      <rect x="120" width="22" height="22" rx="7" fill="#23D18B" opacity=".34"/>
      <rect x="150" width="22" height="22" rx="7" fill="#FFFFFF" opacity=".12"/>
      <animateTransform attributeName="transform" type="translate" values="18 104;18 98;18 104" dur="4.8s" repeatCount="indefinite"/>
    </g>
  </g>
