<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">MTC Analytics dashboard motion preview</title>
  <desc id="desc">Animated product dashboard with performance bars, risk score, checklist status, weekly review and heatmap.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#111722" offset="0"/>
      <stop stop-color="#05070B" offset="1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#F0C55A" offset="0"/>
      <stop stop-color="#8F6720" offset="1"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="0">
      <stop stop-color="#F0C55A" offset="0"/>
      <stop stop-color="#23D18B" offset="1"/>
    </linearGradient>
  </defs>
  <rect width="720" height="460" rx="34" fill="#05070B"/>
  <rect x="1" y="1" width="718" height="458" rx="34" fill="url(#panel)" stroke="rgba(255,255,255,.12)"/>
  <path d="M520 0h200v168c-56 4-116-8-162-38-38-25-54-68-38-130z" fill="#F0C55A" opacity=".07"/>
  <path d="M0 318c62-18 142-10 194 28 34 25 46 67 28 114H0z" fill="#F0C55A" opacity=".035"/>

  <g transform="translate(34 30)">
    <rect width="652" height="52" rx="18" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,.08)"/>
    <rect x="18" y="20" width="16" height="12" rx="6" fill="#F0C55A"/>
    <rect x="42" y="20" width="16" height="12" rx="6" fill="#586272"/>
    <rect x="66" y="20" width="16" height="12" rx="6" fill="#586272"/>
    <text x="98" y="31" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#F7E7B2" letter-spacing="1.2">MTC ANALYTICS</text>
    <text x="500" y="31" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#8F9AAF" letter-spacing="1.6">LIVE REVIEW</text>
  </g>

  <g transform="translate(34 104)">
    <rect width="198" height="104" rx="22" fill="rgba(255,255,255,.052)" stroke="rgba(255,255,255,.09)"/>
    <text x="18" y="30" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="900" fill="#8F9AAF" letter-spacing="1.3">RISK SCORE</text>
    <text x="18" y="72" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="900" fill="#FFF4D6">8.4</text>
    <rect x="92" y="60" width="78" height="8" rx="4" fill="rgba(255,255,255,.09)"/>
    <rect x="92" y="60" width="58" height="8" rx="4" fill="#D8B457">
      <animate attributeName="width" values="44;62;58;66;44" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(254 104)">
    <rect width="198" height="104" rx="22" fill="rgba(255,255,255,.052)" stroke="rgba(255,255,255,.09)"/>
    <text x="18" y="30" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="900" fill="#8F9AAF" letter-spacing="1.3">DISCIPLINE INDEX</text>
    <text x="18" y="72" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="900" fill="#FFF4D6">91%</text>
