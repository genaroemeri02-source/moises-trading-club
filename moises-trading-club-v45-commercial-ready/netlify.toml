[build]
  command = "npm run build"
  publish = "dist"

# Render Backend Edition:
# 1) Deployá /server en Render.
# 2) Reemplazá la URL de abajo por tu backend real, por ejemplo:
#    https://mtc-render-backend.onrender.com/api/:splat
[[redirects]]
  from = "/api/*"
  to = "https://REEMPLAZAR-CON-TU-BACKEND-RENDER.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
